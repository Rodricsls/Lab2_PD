name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r docker/requirements-api.txt pytest ruff==0.17.3
      - run: ruff check .
      # Pruebas del contrato con datos sintéticos: sin MLflow, Postgres ni Airflow.
      - run: pytest -q
